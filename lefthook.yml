# O pre-push local é o portão de qualidade; CI remoto indisponível por cobrança.
min_version: 2.2.2
lefthook: ./node_modules/.bin/lefthook
assert_lefthook_installed: true
pre-commit:
  commands:
    qualidade:
      run: npm run check
commit-msg:
  commands:
    commitlint:
      run: npm exec --offline -- commitlint --edit "{1}"
pre-push:
  jobs:
    - name: qualidade
      use_stdin: true
      script: qualidade.sh
      runner: sh
